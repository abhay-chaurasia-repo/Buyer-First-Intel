<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Due Diligence">
  <!-- User mark: terracotta tile + white house / loupe / 4-pane window cutouts -->
  <rect width="512" height="512" fill="#C68642"/>

  <g
    stroke="#FFFFFF"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- House with eaves; bottom-right open so the handle breaks the corner -->
    <path d="M160 238 L112 238 L256 92 L400 238 L352 238 V350"/>
    <path d="M160 238 V412 H300"/>
    <!-- Chimney -->
    <path d="M330 158 V108 H366"/>
  </g>

  <!-- Magnifier centered in the house -->
  <circle cx="256" cy="286" r="96" fill="#C68642" stroke="#FFFFFF" stroke-width="26"/>

  <!-- Window frame + cross; panes are terracotta cutouts (not solid white squares) -->
  <g
    stroke="#FFFFFF"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <rect x="208" y="238" width="96" height="96" rx="8"/>
    <line x1="256" y1="238" x2="256" y2="334"/>
    <line x1="208" y1="286" x2="304" y2="286"/>
  </g>

  <!-- Handle 45° through the open bottom-right corner -->
  <line
    x1="326"
    y1="354"
    x2="404"
    y2="432"
    stroke="#FFFFFF"
    stroke-width="26"
    stroke-linecap="round"
  />
</svg>
