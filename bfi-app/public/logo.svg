<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Due Diligence">
  <!-- Full-bleed terracotta; CSS rounds to squircle in-header -->
  <rect width="512" height="512" fill="#D68C45"/>

  <g
    stroke="#FFFFFF"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Continuous house with eaves; bottom-right left open for the handle -->
    <path d="M152 236 L118 236 L256 128 L394 236 L360 236 V372 H300"/>
    <path d="M152 236 V372"/>
    <!-- Chimney -->
    <path d="M328 168 V124 H368"/>
  </g>

  <!-- Magnifier centered in house body -->
  <circle cx="256" cy="286" r="70" fill="#D68C45" stroke="#FFFFFF" stroke-width="28"/>

  <!-- 2×2 window -->
  <g fill="#FFFFFF">
    <rect x="226" y="256" width="24" height="24" rx="3"/>
    <rect x="262" y="256" width="24" height="24" rx="3"/>
    <rect x="226" y="292" width="24" height="24" rx="3"/>
    <rect x="262" y="292" width="24" height="24" rx="3"/>
  </g>

  <!-- Handle through open bottom-right corner -->
  <line
    x1="308"
    y1="336"
    x2="392"
    y2="420"
    stroke="#FFFFFF"
    stroke-width="28"
    stroke-linecap="round"
  />
</svg>
